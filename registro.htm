  <main>

    <h1>Formulario de registro</h1>
    <p>Completa los siguientes datos para solicitar tu registro en Conquer Academy.</p>
    <form action="#" method="post" enctype="multipart/form-data">
      <p>
        <label for="nombre">Nombre completo:</label><br>
        <input type="text" id="nombre" name="nombre" autocomplete="name" required>
      </p>
      <p>
        <label for="fecha-nacimiento">Fecha de nacimiento:</label><br>
        <input type="date" id="fecha-nacimiento" name="fecha_nacimiento" required>
      </p>
      <p>
        <label for="email">Email:</label><br>
        <input type="email" id="email" name="email" autocomplete="email" required>
      </p>
      <p>
        <label for="direccion">Dirección:</label><br>
        <input type="text" id="direccion" name="direccion" autocomplete="street-address">
      </p>
      <p>
        <label for="web">Página web:</label><br>
        <input type="url" id="web" name="pagina_web" placeholder="https://">
      </p>
      <p>
        <label for="foto">Foto:</label><br>
        <input type="file" id="foto" name="foto" accept="image/*">
      </p>
      <p>
        <label for="biografia">Biografía:</label><br>
        <textarea id="biografia" name="biografia" rows="6" cols="40"></textarea>
      </p>
      <p><input type="checkbox" id="privacidad" name="privacidad" required> <label for="privacidad">He leído y acepto el aviso legal.</label></p>
      <p><button type="submit">Enviar registro</button></p>
    </form>

  </main>
